# runtime.yaml — 動かす環境と、AI モデルの割り当て
#
# 「誰に何を発信するか」は brand.yaml。ここは「どの PC で・どのモデルで動かすか」だけを決めます。
# carousel スキルが毎回の起動の最初に読みます。


# ------------------------------------------------------------------
# 1. OS — Python の呼び方を決める
# ------------------------------------------------------------------
# auto    = Claude Code が動いている OS に合わせる（ふつうはこのまま）
# windows = Python を py で呼ぶ
# mac     = Python を python3 で呼ぶ
os: auto

# Python の呼び方を直接指定したいときだけ書く（例: "python"、"C:/Python312/python.exe"）。
# 空なら上の os から決まる。Windows で py が無いと言われたら "python" を試す
python_command: ""


# ------------------------------------------------------------------
# 2. モデル — サブエージェントごとに選ぶ
# ------------------------------------------------------------------
# 書ける値: opus / sonnet / haiku
# 各モデルの違いと、おすすめの組み合わせは docs/SETUP-GUIDE.md の「モデルの選び方」にあります。
#
# 司令塔（全体の進行役）はここでは選べません。Claude Code で選んでいるモデルがそのまま使われます。
# 切り替えは Claude Code の /model で行います。
models:
  theme_picker: sonnet     # ネタ選び。索引と履歴を照合して1件選ぶだけなので sonnet で足りる
  caption_writer: sonnet   # キャプション。評価役がチェックするので sonnet で足りる
  evaluator: opus          # 評価役。「悪い投稿を出さない」最後の砦なので、既定は opus
