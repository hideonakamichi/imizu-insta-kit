# brand.yaml — このアカウント固有の設定（発信内容・売りたいもの・トーン・デザイン）
#
# ===================================================================
#  このファイルが「アカウントの人格」を決める唯一の場所です。
#  ここさえ書き換えれば、パイプライン本体（スクリプト・スキル）は
#  一切触らずに別ジャンルのアカウントへ流用できます。
#
#  書き方が分からない場合は、Claude Code で次のように頼んでください:
#      「brand-setup スキルで設定して。発信したいのは〇〇で、売りたいのは△△」
#  対話でヒアリングしながら、このファイルを埋め、投稿のネタ元になる
#  文章（content/sources/*.md）の最初の数本も一緒に作ってくれます。
# ===================================================================


# ------------------------------------------------------------------
# 1. アカウント — 誰が何のために発信するのか
# ------------------------------------------------------------------
account:
  # Instagramのハンドル名（@付き）。投稿は手動だが、設定の取り違えを防ぐ目印として必須にしている
  handle: "@your_account"

  # アカウントの表示名／通称
  name: "（アカウント名）"

  # このアカウントは何のために存在するか。1〜2文で書く。
  # 例: 「〇〇に悩む人が、選択肢を比較して自分で決められるようにするための情報発信」
  purpose: "（このアカウントの目的を1〜2文で）"

  # 関連サイトがあればURL。無ければ空文字のままでよい
  site_url: ""


# ------------------------------------------------------------------
# 2. 読者 — 誰に届けるのか
#    ここが曖昧だと、生成される投稿もぼやけます。具体的に書いてください。
# ------------------------------------------------------------------
audience:
  # 対象読者。属性ではなく「状況」で書くと精度が上がる
  # 悪い例: 「20〜40代女性」／ 良い例: 「子どもが学校に行きたがらず、次の一手を探している保護者」
  who: "（対象読者を状況で1文）"

  # その読者が今かかえている悩み・知りたいこと（3〜5個）
  pains:
    - "（悩み1）"
    - "（悩み2）"
    - "（悩み3）"

  # この発信を通じて実現したい状態（ビジョン）
  vision: "（この発信で実現したい状態を1文）"


# ------------------------------------------------------------------
# 3. オファー — 売りたいコンテンツ／サービス
#    最終スライドの誘導文（cta）とキャプションのCTAがここから作られます。
#    売り物が無い純粋な情報発信アカウントなら、enabled: false にしてください。
# ------------------------------------------------------------------
offer:
  enabled: true

  # 売りたいものの名前
  name: "（商品・サービス・サイト名）"

  # それは何で、読者にとって何の役に立つか
  description: "（1〜2文で）"

  # プロフィールリンクの誘導先（URLまたは「プロフィールのリンク」等の表現）
  landing: "プロフィールのリンク"

  # 最終スライドに入れる誘導文。18文字以内・1行・煽らない案内文にすること。
  # ボタン風装飾・URL直書き・「今すぐ」等の煽り文言は evaluator が不合格にします。
  cta_line: "（18文字以内の控えめな誘導文）"

  # キャプションに誘導を入れる頻度の方針
  # every=毎回 / relevant=テーマが関連するときだけ / rare=ごくたまに
  cta_frequency: "relevant"


# ------------------------------------------------------------------
# 4. トーン — 書き方の憲法（全コンテンツ共通・evaluatorがここで合否判定する）
# ------------------------------------------------------------------
tone:
  # 基本の声色。1文で
  voice: "（例: 共感と実用情報。読者が安心して比較・行動できることを最優先する）"

  # 絶対に守るルール。ここに書いたものは evaluator の判定項目に直結します。
  # 下の5つは業種を問わず有効な安全弁なので、原則そのまま残すことを推奨します。
  policy:
    - "煽らない: 不安を材料にしない。「〜しないと手遅れ」「放置すると危険」系の見出しは禁止"
    - "断定しない: 優劣・効果を断定しない。「おすすめ」ではなく「比較材料」として提示する"
    - "ランキングにしない: 対象を順位付けしない"
    - "未確認は未確認と書く: 確認できていない情報は「未確認」「各自で確認を」と明記する"
    - "専門領域に踏み込まない: 医療・法律・金融など資格が要る領域で診断的・断定的なことを言わない"
    # ↓ 業種特有のNGがあればここに追加する
    # - "（例: 効果効能を断定しない。景表法・薬機法に触れる表現を使わない）"

  # 使ってはいけない語句（部分一致でチェックされます）
  ng_words:
    - "今すぐ"
    - "手遅れ"
    - "絶対"
    - "必ず稼げる"


# ------------------------------------------------------------------
# 5. テーマ軸 — 投稿の切り口の分類
#    ネタ元の各節は、見出しに keywords のどれかが含まれていればその軸に振り分けられます
#    （上から順に最初に当たった軸。どれにも当たらなければ content_sources.default_axis）。
#    theme-picker は軸が偏らないように選ぶので、軸が分かれているほど投稿に変化が出ます。
# ------------------------------------------------------------------
strategy_axes:
  - key: "how-to"
    label: "やり方・手順"
    description: "読者が今日から動ける具体的な手順を示す"
    keywords: ["やり方", "手順", "方法", "進め方", "作り方", "使い方", "ステップ", "コツ"]
  - key: "checklist"
    label: "確認リスト"
    description: "判断・比較の前に確認すべき項目を並べる"
    keywords: ["チェック", "確認", "リスト", "条件", "観点", "ポイント", "用語"]
  - key: "myth-busting"
    label: "誤解の解消"
    description: "よくある通説を、事実で穏やかにほどく"
    keywords: ["誤解", "違い", "ではない", "勘違い", "失敗", "本当"]
  - key: "choice-expansion"
    label: "選択肢の紹介"
    description: "知られていない選択肢・タイプを並べて見せる"
    keywords: ["選択肢", "種類", "タイプ", "比較", "パターン", "例"]
  - key: "numbers"
    label: "数字ネタ"
    description: "手元のデータを「その数字が何を意味するか」まで含めて見せる"
    keywords: ["数字", "データ", "割合", "件数", "統計", "調査"]
  - key: "empathy"
    label: "共感・気持ち"
    description: "読者の状況に寄り添う。売り込まない回"
    keywords: ["気持ち", "悩み", "不安", "つらい", "大丈夫"]


# ------------------------------------------------------------------
# 5.5 ネタ元 — 投稿の根拠にする「自分の文章」の置き場所
#    投稿は、ここに置いた文章の1節（## 見出しの単位）の紹介として作られます。
#    1行のテーマだけから書かせると一般論になって中身が薄くなるため、
#    画面・キャプションに書く事実は「その節に書いてあること」に限定します。
#    carousel スキルが起動のたびに build_article_index.py を実行し、
#    content/articles/（節ごとの根拠テキスト）と content/themes.md のストックを作り直します。
#    文章を足せばネタが増えます。書式は content/sources/README.md。
# ------------------------------------------------------------------
content_sources:
  # Markdown の置き場所（基本）。ブログ記事の下書き・FAQ・商品説明・講座の台本など、
  # 自分で書いた文章を .md で置くだけ。README.md と、_ で始まるファイルはネタにしません
  markdown_dir: "content/sources"

  # （任意）自サイトの記事HTMLもネタ元にする。Markdown と併用できます
  html:
    enabled: false
    # 記事HTMLの置き場所（このリポジトリのルートからの相対パス）
    source_dir: "../my-site/articles"
    # 公開URLの接頭辞。キャプション・画像には書きません（IGではリンクにならない）。
    # evaluator と人間が出典をたどるために索引へ記録するだけ
    base_url: "https://example.com/articles/"
    # ネタにしないファイル（記事一覧ページなど）
    exclude:
      - "index.html"
    # 本文を囲む div の class。空なら <article> → <main> → <body> の順に探します
    body_class: ""
    # 本文の終わりを示す footer の class。空なら </article>・</main>・<footer> の手前まで
    footer_class: ""
    # 出典・参考文献をまとめた <aside> の class（あれば一次ソースとして渡します）。無ければ空
    source_box_class: ""
    # 更新日を拾う正規表現（1つ目の括弧が日付）。無ければ空
    updated_pattern: "更新日[：:]\\s*([^<]+)<"
    # 対話形式の記事で、話者名を入れた <p> の class／囲み記事のタイトルの class。無ければ空
    speaker_class: ""
    box_title_class: ""

  # 画面に出す短い名前（13字以内）。キーはファイル名（拡張子なし）。
  # ここに無いものは front matter の short_title、それも無ければタイトルの先頭13字になります。
  # 13字を超えるタイトルは途中で切れた名前が画面に出るので、ここに登録してください
  short_titles: {}
  #  my-first-article: "はじめての〇〇"

  # どの軸のキーワードにも当たらなかった節の軸（省略時は strategy_axes の先頭）
  default_axis: "how-to"

  # 根拠テキストの読み方について、下流の全員に伝える注意（任意・1文）
  # 例: "記事は先生と生徒の対話形式。生徒の感想・つぶやきは事実ではないので根拠にしない"
  format_note: ""

  # 扱いに縛りがある話題の注意書き（任意）。本文か導入部に words のどれかがある節、
  # またはファイル名が slug_prefixes で始まるネタ元の全節に、note が「注意」として付きます。
  # 構成・キャプションはこの注意に従い、evaluator は守られているかを判定します。
  # 付けすぎても害はありません（「触れるなら守れ」という条件付きの注意）が、漏れると
  # 縛りが伝わらないので words は広めに取ってください
  cautions: []
  #  - note: "まだ決まっていない制度の話に触れるなら、決定事項のように書かず「検討中」「案」を画面の文字にも明記する"
  #    words: ["検討中", "審議", "改正案", "未確定"]
  #    slug_prefixes: ["news-"]
  #  - note: "効果効能を断定しない。体験談は「個人の感想」と分かる形でのみ扱う"
  #    words: ["効果", "改善", "治る"]

  # 続きを読める場所の言い方（キャプションの案内文に使います。URLは書きません）
  # 例: "プロフィールのリンク先のブログ"。読める場所が無ければ空のまま
  where_to_read: ""


# ------------------------------------------------------------------
# 6. ハッシュタグ — キャプションに付ける10〜15個の元ネタ
# ------------------------------------------------------------------
hashtags:
  # 毎回入れる軸タグ（3〜5個）。ジャンルを一意に特定できるもの
  core:
    - "#（軸タグ1）"
    - "#（軸タグ2）"
    - "#（軸タグ3）"

  # テーマに応じて混ぜる広めのタグ（5〜10個）
  wide:
    - "#（広めタグ1）"
    - "#（広めタグ2）"
    - "#（広めタグ3）"


# ------------------------------------------------------------------
# 7. デザイン — スライドを描く固定パレット
#    3色をhexで固定することでスライド間の一貫性を担保します（AI任せにしない）。
#    赤系・ネオン系の煽り色は避けてください。
#    詳細な見た目の方針は docs/DESIGN.md（Minimal方針）にあります。
# ------------------------------------------------------------------
design:
  palette:
    bg: "#FAF7F2"      # 背景: 明るく落ち着いたトーン
    text: "#1F2A44"    # 文字: 背景に対して高コントラスト
    accent: "#5B8DB8"  # アクセント: 強調1点だけに使う落ち着いた色
